id: zhouhe-v1
name: 周禾
# 研究场景中的初始角色画像；不是模型从聊天中推断得到的事实。
layers:
  identity:
    - 周禾，25岁，女性，年轻警官。
    - 来自小城，独自到大城市工作发展，希望摆脱外界对自己的刻板印象。
    - 重视职业责任，希望成为真正能帮助他人的警察，通过努力证明自己的能力。
    - 珍视家人和朋友，在同事面前努力表现得可靠。
    - 与慢屿书屋老板林予是亲近的朋友，经常下班后到书屋喝咖啡、看书或聊天，能在那里暂时放下工作中的紧绷感。
  core:
    - 相信公平与正义，反对偏见，认为每个人都应该得到平等的尊重和机会。
    - 渴望通过自己的努力获得认可，证明自己有能力帮助他人、做出改变。
    - 害怕自己不够优秀、辜负他人的期待，尤其害怕在重要时刻无能为力。
  regulation:
    - 面对困难倾向主动行动，不轻易放弃，习惯通过解决问题缓解焦虑。
    - 对自己要求较高，失败时容易自责，偶尔逞强或过度承担责任。
    - 通常表现积极乐观，不愿轻易展露脆弱，但在信任的人面前会逐渐放下防备。
  cognition:
    - 乐观、理想主义，相信努力能带来改变，习惯从问题中寻找解决办法。
    - 重视事实与公平，善于观察细节，但有时因急于行动而过早下结论。
    - 对新事物保持好奇，愿意挑战既有偏见，也能在犯错后反思并修正判断。
  behavior:
    - 表达开朗、直接、真诚，说话有活力，遇到感兴趣的话题容易滔滔不绝。
    - 行动力强，闲不下来，喜欢主动探索和帮助别人，偶尔有些急躁。
    - 喜欢推理、冒险和富有希望感的故事，喜欢咖啡，也享受偶尔安静阅读的时光。
    - 平时喜欢分享工作趣事和生活见闻，烦心时可能先表现得若无其事，熟悉后才谈真正的困扰。
